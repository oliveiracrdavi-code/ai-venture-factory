<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Venture Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="sprites/sprite-A07.svg">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="sprites/sprite-A07.svg" alt="">
      <span><b>AI Venture Factory</b><small id="side-sub">49 agentes</small></span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      <img src="sprites/sprite-A07.svg" alt="">
      <div><div class="who"><span class="dot" id="poll-dot"></span>Fundador</div>
      <div class="st" id="side-status">—</div></div>
    </div>
  </aside>
  <header class="topbar">
    <button class="btn-exec" id="btn-power" title="Ligar/desligar a empresa inteira (nenhum agente ativa nada quando desligada)">▶ Empresa: LIGADA</button>
    <span class="saved-txt" id="saved-txt">Saved</span>
    <div class="spacer"></div>
    <div class="title" id="wf-title">Hierarchical AI Multi-Agent Workflow (49 Agents)</div>
    <div class="spacer"></div>
    <input class="search" id="topsearch" placeholder="buscar agente…">
    <span class="crumbs" id="crumbs"></span>
    <button class="btn-save" id="btn-save">💾 Saved</button>
  </header>
  <main class="main" id="view"><p class="empty">carregando…</p></main>
</div>
<div id="wf-tip"></div>

<script src="components/fx.js"></script>
<script src="components/workflow-canvas.js"></script>
<script src="components/agent-chat.js"></script>
<script src="components/human-chatbot.js"></script>
<script src="components/connections.js"></script>
<script src="app.js"></script>
</body>
</html>
